server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Política de segurança de conteúdo. Fica aqui, e não no Caddy ou no
    # index.html, porque este ficheiro está versionado: o cabeçalho acompanha o
    # deploy e não se perde num reload à mão do edge.
    #
    # O que a app precisa, e porquê:
    # - script-src 'self' sem 'unsafe-inline': o build do Vite emite um único
    #   script externo, não há script inline em lado nenhum.
    # - style-src-attr 'unsafe-inline': o React aplica 133 atributos style=""
    #   (fontes, cores inline), que os atributos de estilo exigem.
    # - style-src sem 'unsafe-inline': permite a folha externa do Tailwind e a
    #   do Google Fonts, mas bloqueia <style> injetado em runtime — o bundle
    #   não cria nenhum, confirmado.
    # - img-src 'self': imagens vêm de /assets e de /uploads (mesma origem,
    #   encaminhada pelo Caddy para a API). Não há data: nem blob: no código.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'" always;

    # nginx + add_header só se aplica a respostas com código 2xx/3xx por
    # omissão; `always` garante que o CSP também vem nos erros.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

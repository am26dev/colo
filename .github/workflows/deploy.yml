name: Deploy para produção

on:
  push:
    branches: [main]

permissions:
  contents: read

# Cada push abre um run, e dois runs a disparar ao mesmo tempo partilham a mesma
# pasta de trabalho na VPS: o `rm -rf node_modules` de um apanha o `npm ci` do
# outro a repor ficheiros e morre com `Directory not empty`. Aqui os runs ficam
# à espera uns dos outros, por ordem de chegada — sem `cancel-in-progress`, para
# que o commit mais recente acab sempre em produção em vez de o mais antigo
# chegar depois e desfazê-lo.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy na VPS
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: echo "deploy" # comando forçado no servidor ignora isto e corre sempre /usr/local/bin/deploy-colo

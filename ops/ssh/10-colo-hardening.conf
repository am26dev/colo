# Endurecimento do SSH, 2026-09-28.
#
# Este ficheiro é lido ANTES do /etc/ssh/sshd_config (o Include está no topo e
# no OpenSSH vale a primeira.directiva encontrada), por isso sobrepõe-se ao
# `PermitRootLogin yes` e à ausencia de `PasswordAuthentication` que lá estavam.
#
# Motivo: o registo mostra ~1170 tentativas de palavra-passe por dia contra a
# conta root, vindas de IPs externos. Com palavras-passe desligadas, esse
# ataque deixa de ter superficie: a unica forma de entrar passa a ser uma
# chave em authorized_keys.

# Sem palavras-passe: so chaves. Elimina o ataque de forca bruta ao password.
PasswordAuthentication no
KbdInteractiveAuthentication no

# root pode entrar, mas sempre com chave (equivale a "prohibit-password").
PermitRootLogin prohibit-password

# PubkeyAuthentication fica explícito para ficar registado que é o metodo
# previsto. Nao mudar: e o que a dona e o GitHub Actions usam.
PubkeyAuthentication yes

# MaxStartups: o valor por omissao (10:30:100) descarta ligacoes aleatoriamente
# a partir de 10 ligacoes NAO autenticadas em curso. Com scanners a bater a
# porta 22, essa ligacao pode ser a de um deploy legitimo. 30:60:100 da folga
# sem deixar de acautelar o numero de ligacoes a processar em paralelo.
MaxStartups 30:60:100

# Sondas de scanner que nem chega a autenticar ficam cortadas cedo.
LoginGraceTime 30
